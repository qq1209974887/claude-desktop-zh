# .github/workflows/release.yml
name: Release

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    if: github.event.workflow_run.conclusion == 'success'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 下载所有平台构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: 整理产物并创建发布
        shell: bash
        run: |
          # 创建发布目录
          mkdir -p release

          # 将每个平台的产物复制到以其命名的目录中
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            mkdir -p "release/$name"
            # 直接复制产物内容（现在 artifact 下载下来就是扁平化的 dist 内容）
            cp -r "$dir"* "release/$name/" 2>/dev/null || true

            # 根据目录名判断平台，确保二进制文件有执行权限
            if [[ "$name" == *"linux"* ]] || [[ "$name" == *"macos"* ]]; then
              # 平台二进制：无 .exe 后缀
              for bin_file in "release/$name/claude-zh-patch"; do
                if [ -f "$bin_file" ]; then
                  chmod 755 "$bin_file"
                  echo "[PASS] 设置执行权限: $bin_file"
                fi
              done
              # 安装脚本
              for script in "release/$name/src/install.sh" "release/$name/src/install.py"; do
                if [ -f "$script" ]; then
                  chmod 755 "$script"
                  echo "[PASS] 设置执行权限: $script"
                fi
              done
            fi
          done

          # 所有目录：遍历权限
          find release/ -type d -exec chmod 755 {} \;
          # 所有非可执行普通文件：可读
          find release/ -type f -not -executable -exec chmod 644 {} \;

          # 列出产物
          echo "=== 发布产物列表 ==="
          ls -la release/
          echo ""
          for d in release/*/; do
            echo "--- $(basename "$d") ---"
            ls -la "$d"
            echo ""
          done

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/claude-zh-patch.exe
            release/**/claude-zh-patch
            release/**/使用说明.md
            release/**/src/**
            release/**/resources/**
            release/**/logs/*.log
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
