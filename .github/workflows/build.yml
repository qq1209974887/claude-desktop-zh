# .github/workflows/build.yml
name: Build

on:
  push:
    tags:
      - 'v*'    # 仅在打标签时构建
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: claude-zh-patch
          - os: macos-latest
            platform: macos
            artifact: claude-zh-patch
          - os: windows-latest
            platform: windows
            artifact: claude-zh-patch.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install pyinstaller questionary

      - name: 编译 ${{ matrix.platform }}
        run: |
          # 日志写到 build/（已提交的目录），dist/ 在全新 Runner 上不存在
          python build/build_exes.py ${{ matrix.platform }} 2>&1 | tee build/build.log

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ matrix.platform }}
          path: |
            dist/
            build/build.log
          retention-days: 30